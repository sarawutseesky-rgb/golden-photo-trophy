name: Timezone Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly on Mondays at 03:00 UTC — catches future time drift regressions
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test-tz:
    name: vitest @ TZ=${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Asia/Bangkok
          - America/New_York
          - Pacific/Kiritimati
          - Pacific/Niue
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run timezone-sensitive tests
        run: bunx vitest run src/lib/__tests__/milestone-rules.timezone.test.ts